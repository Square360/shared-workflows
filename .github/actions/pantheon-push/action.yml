name: 'Push code to a Pantheon environment'
description: 'Sets up PHP, installs Composer dependencies, and pushes the current workspace to a Pantheon environment via the pantheon-systems/push-to-pantheon script, and records a GitHub deployment. Assumes the repo is already checked out.'

inputs:
  site:
    description: 'Pantheon site machine name'
    required: true
  target_env:
    description: 'Target Pantheon environment (dev, test, live, or a multidev like pr-22 / rc-2026-21 / epr-757)'
    required: true
  source_env:
    description: 'Source environment for multidev clone (e.g. dev or live). Leave empty for non-multidev deploys (i.e. when target_env is dev/test/live).'
    required: false
    default: ''
  ssh_key:
    description: 'SSH key for Pantheon git access. Pass from caller-side secrets.PANTHEON_SSH_KEY.'
    required: true
  machine_token:
    description: 'Pantheon machine token. Pass from caller-side secrets.PANTHEON_MACHINE_TOKEN.'
    required: true
  commit_message:
    description: 'Commit message used on the synthetic deploy commit.'
    required: false
    default: 'Automated deployment from GitHub Actions'
  php_version:
    description: 'PHP version for the build runner.'
    required: false
    default: '8.4'

runs:
  using: 'composite'
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php_version }}
        tools: composer:v2

    - name: Add Bitbucket to known hosts
      shell: bash
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan bitbucket.org >> ~/.ssh/known_hosts

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install Composer dependencies
      shell: bash
      run: composer install --no-dev --optimize-autoloader --no-interaction

    # We build on Actions and push the full artifact to Pantheon (no Build
    # Tools, no integrated Composer on Pantheon). Source-repo .gitignore
    # excludes vendor/, web/core/, contrib dirs, scaffolded files — exactly
    # the files Pantheon needs. Upstream push-to-pantheon's direct-git path
    # does `git push HEAD` (scripts/main.sh:398), so the artifact has to be
    # committed before that runs.
    #
    # We commit it ourselves with --quiet so upstream's own commit step
    # (main.sh:387, gated on `! git diff --cached --quiet`) is a no-op.
    # That suppresses ~46k lines of `create mode 100644 …` diff summary
    # per deploy — the full file list is still on the commit object and
    # inspectable via `git show --stat HEAD` against the Pantheon repo.
    - name: Stage and commit Composer build artifact for Pantheon push
      shell: bash
      env:
        # Match the values passed to upstream's push-to-pantheon step below
        # so the commit author is the same whether we commit here or upstream
        # commits later. Set them inline on `git commit` (via -c) rather than
        # globally — upstream's "Configure Git User" step runs after this
        # action, and we don't want to fight it over global config.
        DEPLOY_GIT_USER_NAME: ${{ github.event.pull_request.user.login || github.actor }}
        DEPLOY_GIT_USER_EMAIL: ${{ github.event.pull_request.user.email || format('{0}@users.noreply.github.com', github.actor) }}
        DEPLOY_COMMIT_MESSAGE: ${{ inputs.commit_message }}
      run: |
        git add -A --force
        # Buffer the path list to disk: piping `git diff --name-only` directly
        # into `head -20` causes git to SIGPIPE on the 21st write, which under
        # `set -e -o pipefail` fails the whole step (v3.1.2 regression).
        STAGED_LIST=$(mktemp)
        git diff --cached --name-only > "${STAGED_LIST}"
        STAGED_COUNT=$(wc -l < "${STAGED_LIST}" | tr -d ' ')
        echo "Staged ${STAGED_COUNT} paths for push to Pantheon"
        echo "Sample (first 20):"
        head -20 "${STAGED_LIST}"
        if [ "${STAGED_COUNT}" -gt 20 ]; then
          echo "  ... ($((STAGED_COUNT - 20)) more)"
        fi
        rm -f "${STAGED_LIST}"

        if ! git diff --cached --quiet; then
          git -c user.name="${DEPLOY_GIT_USER_NAME}" \
              -c user.email="${DEPLOY_GIT_USER_EMAIL}" \
              commit -q -m "${DEPLOY_COMMIT_MESSAGE}"
          echo "Committed artifact (quiet). Upstream push step will push HEAD to Pantheon."
        else
          echo "Nothing staged after composer install; skipping pre-commit (upstream push will no-op the commit too)."
        fi

    # Pre-flight: ensure the target Pantheon env is in git mode. If it's been
    # flipped to SFTP (e.g. someone opened the Dashboard Code view and toggled
    # it), the push would be rejected by Pantheon's pre-receive hook —
    # upstream push-to-pantheon's main.sh swallows that exit code and
    # reports the step as successful. We pre-empt the most common cause here;
    # the verify-after-push step below catches anything else.
    #
    # Only applies if the env already exists. New multidevs are created in git
    # mode by terminus multidev:create (handled inside the upstream action).
    - name: Ensure Pantheon env is in git mode (pre-flight)
      shell: bash
      env:
        TERMINUS_MACHINE_TOKEN: ${{ inputs.machine_token }}
        SITE: ${{ inputs.site }}
        TARGET_ENV: ${{ inputs.target_env }}
      run: |
        set -euo pipefail
        # Use env:list (an authoritative listing) rather than env:info >/dev/null,
        # which would silently swallow auth/network errors as "env doesn't exist".
        # If terminus itself errors, set -e fails the step with the real cause.
        # Matches the existing pattern in reusable-pantheon-deploy-rc-multidev.yml
        # for the live-env probe.
        if ! terminus env:list "${SITE}" --format=list | grep -q "^${TARGET_ENV}$"; then
          echo "Env ${SITE}.${TARGET_ENV} does not exist yet; multidev:create will provision it in git mode. Skipping connection-mode check."
          exit 0
        fi
        # `connection_mode` lives on env:info, NOT on connection:info (which
        # only returns the git/sftp connection URLs and commands). v3.2.4
        # shipped with the wrong command — terminus errors with "The requested
        # field, 'connection_mode', is not defined" — and the no-stderr-swallow
        # fix from Copilot's review surfaced it.
        # No `2>/dev/null` fallback: if terminus errors here (auth, network,
        # schema drift), we want the step to fail with the real error rather
        # than coerce the result to empty and attempt connection:set on bad data.
        MODE=$(terminus env:info "${SITE}.${TARGET_ENV}" --field=connection_mode)
        echo "Current connection mode for ${SITE}.${TARGET_ENV}: ${MODE}"
        if [[ "${MODE}" != "git" ]]; then
          echo "::warning::${SITE}.${TARGET_ENV} is in '${MODE}' mode. Switching to git so the push isn't rejected by the pre-receive hook."
          terminus connection:set "${SITE}.${TARGET_ENV}" git
        fi

    # We run upstream pantheon-systems/push-to-pantheon's script, not its action
    # (#176). The action wraps scripts/main.sh in a composite whose two
    # bobheadxi/deployments@v1 steps target Node 20; that action is unmaintained
    # and has no Node 24 release, and nested `uses:` are fetched at job setup, so
    # nothing we run beforehand can patch them out. main.sh is self-contained,
    # so we download it at the pinned tag, check it against a pinned sha256, and
    # call the same functions the action calls, in the same order. The GitHub
    # deployment record is posted by our own steps below.
    #
    # Bumping UPSTREAM_VERSION: re-read the new action.yml for added or
    # reordered steps, update UPSTREAM_SHA256, and re-validate the unshallow
    # patch below.
    #
    # The unshallow patch: upstream's prepare_site_root has an unguarded
    # `git fetch --unshallow origin` (main.sh:617 at 0.9.5). On a shallow clone it
    # races the runner's git state ("shallow file has changed since we read it");
    # on a complete clone it errors outright ("--unshallow on a complete
    # repository does not make sense"). Either aborts the deploy before
    # verify-after-push runs. We append `|| true`; push_to_pantheon still runs its
    # own guarded unshallow before the push.
    - name: Fetch upstream push-to-pantheon script
      shell: bash
      env:
        UPSTREAM_VERSION: "0.9.5"
        UPSTREAM_SHA256: "8215f63778f72008df336b212a2f3360cb7a61061a57caed6b2c1605c3af1dce"
        TARGET_ENV: ${{ inputs.target_env }}
      run: |
        set -euo pipefail
        PTP_DIR="${RUNNER_TEMP}/push-to-pantheon-${UPSTREAM_VERSION}"
        PTP_SCRIPT="${PTP_DIR}/main.sh"
        mkdir -p "${PTP_DIR}"
        curl -fsSL --retry 3 \
          "https://raw.githubusercontent.com/pantheon-systems/push-to-pantheon/${UPSTREAM_VERSION}/scripts/main.sh" \
          -o "${PTP_SCRIPT}"
        echo "${UPSTREAM_SHA256}  ${PTP_SCRIPT}" | sha256sum -c -
        # `#` delimiter: the replacement contains `||`.
        sed -i 's#^\([[:space:]]*\)git fetch --unshallow origin$#\1git fetch --unshallow origin || true#' "${PTP_SCRIPT}"
        if ! grep -qF 'git fetch --unshallow origin || true' "${PTP_SCRIPT}"; then
          echo "::error::Unshallow patch did not apply. Upstream main.sh may have changed shape."
          grep -n 'unshallow' "${PTP_SCRIPT}" || true
          exit 1
        fi
        chmod +x "${PTP_SCRIPT}"
        echo "PTP_SCRIPT=${PTP_SCRIPT}" >> "$GITHUB_ENV"
        echo "PANTHEON_TARGET_ENV=${TARGET_ENV}" >> "$GITHUB_ENV"
        echo "Fetched push-to-pantheon ${UPSTREAM_VERSION} main.sh (sha256 verified, unshallow patched)."

    - name: Check required permissions
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        IFS=' ' read -r -a MISSING <<< "$("${PTP_SCRIPT}" check_missing_permissions)"
        if [ ${#MISSING[@]} -gt 0 ]; then
          "${PTP_SCRIPT}" get_missing_permissions_help "${MISSING[@]}"
          exit 1
        fi
        echo "Required permissions present."

    # Replaces upstream's "Start deployment" (bobheadxi/deployments@v1). Same
    # environment name and payload keys, so upstream's cleanup and the PR
    # timeline find it as before. Best-effort: the record is the "View
    # deployment" link, not a gate (verify-after-push is the gate), so an API
    # failure warns and the deploy carries on.
    - name: Start GitHub deployment
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        REF: ${{ github.event.pull_request.head.sha || github.sha }}
        SITE: ${{ inputs.site }}
        TARGET_ENV: ${{ inputs.target_env }}
        SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -uo pipefail
        BODY=$(jq -nc --arg ref "$REF" --arg env "$TARGET_ENV" \
          --arg site "$SITE" --arg branch "$SOURCE_BRANCH" \
          '{ref: $ref, environment: $env, auto_merge: false, required_contexts: [],
            production_environment: false,
            payload: {pantheon_site: $site, pantheon_env: $env, source_branch: $branch}}')
        if ! ID=$(gh api -X POST "repos/${REPO}/deployments" --input - --jq .id <<< "$BODY"); then
          echo "::warning::Could not create the GitHub deployment for ${TARGET_ENV}; continuing without a deployment record."
          exit 0
        fi
        echo "GITHUB_DEPLOYMENT_ID=${ID}" >> "$GITHUB_ENV"
        gh api -X POST "repos/${REPO}/deployments/${ID}/statuses" \
          -f state=in_progress -f log_url="$LOG_URL" --silent \
          || echo "::warning::Could not mark deployment ${ID} in progress."
        echo "GitHub deployment ${ID} started for ${TARGET_ENV}."

    - name: Configure SSH key
      uses: webfactory/ssh-agent@v0.10.0
      with:
        ssh-private-key: ${{ inputs.ssh_key }}

    - name: Set up host keys for Pantheon
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh_key }}
      run: '"${PTP_SCRIPT}" setup_ssh_hostkeys'

    - name: Check multidev limit
      id: check_multidev_limit
      if: ${{ !contains(fromJSON('["dev","test","live"]'), inputs.target_env) }}
      shell: bash
      env:
        PANTHEON_SITE: ${{ inputs.site }}
      run: '"${PTP_SCRIPT}" check_multidev_limit'

    - name: Comment on PR if multidev limit reached
      if: ${{ steps.check_multidev_limit.outputs.multidev_available == 'false' && github.event.pull_request.number }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        gh pr comment "${PR_NUMBER}" --body "⚠️ **Unable to create a Multidev environment**

        Your Pantheon site has reached its Multidev limit. No environments are available for this deployment.

        **Next steps:**
        1. Delete unused Multidev environments via the Pantheon dashboard
        2. Contact your Pantheon account team to increase your Multidev limit
        3. Re-run this workflow once environments are available

        For more information, see the [Pantheon Multidev documentation](https://pantheon.io/docs/multidev)."

    - name: Abort deployment if multidev limit reached
      if: ${{ steps.check_multidev_limit.outputs.multidev_available == 'false' }}
      shell: bash
      run: |
        echo "::error::Aborting deployment: Multidev limit reached. Delete unused environments or contact Pantheon to increase your limit."
        exit 1

    - name: Configure Git user
      shell: bash
      env:
        PANTHEON_GIT_USER_NAME: ${{ github.event.pull_request.user.login || github.actor }}
        PANTHEON_GIT_USER_EMAIL: ${{ github.event.pull_request.user.email || format('{0}@users.noreply.github.com', github.actor) }}
      run: |
        git config --global user.email "${PANTHEON_GIT_USER_EMAIL}"
        git config --global user.name "${PANTHEON_GIT_USER_NAME}"

    - name: Prepare site root
      shell: bash
      env:
        SITE_ROOT: ''
        PANTHEON_SITE: ${{ inputs.site }}
        PANTHEON_SOURCE_ENV: ${{ inputs.source_env }}
      run: '"${PTP_SCRIPT}" prepare_site_root'

    # skip_build_tools path: create the multidev if missing, then
    # `git push --force` HEAD to the env's branch. COMPOSER_NO_SECURITY_BLOCKING
    # carried over from the action call; the audit gate runs earlier, in
    # composer-audit.
    - name: Push to Pantheon
      shell: bash
      env:
        COMPOSER_NO_SECURITY_BLOCKING: 1
        PANTHEON_SITE: ${{ inputs.site }}
        PANTHEON_SOURCE_ENV: ${{ inputs.source_env }}
        PANTHEON_COMMIT_MESSAGE: ${{ inputs.commit_message }}
        SITE_ROOT: ''
        SKIP_BUILD_TOOLS: 'true'
        GITHUB_TOKEN: ${{ github.token }}
        PR_NUM: ${{ github.event.pull_request.number }}
      run: '"${PTP_SCRIPT}" push_to_pantheon'

    # Verify-after-push: upstream's main.sh does NOT propagate the exit code
    # from `git push` (no `set -e`; push_to_pantheon ends `exit 0`). When
    # Pantheon rejects the push (SFTP mode, branch protection, lost-update race,
    # etc.) the step still reports success. We compare
    # the local HEAD we meant to push against the remote ref Pantheon now has,
    # and fail the workflow loudly if they don't match. Belt-and-braces:
    # catches the SFTP case our pre-flight already handles AND any future
    # silent-fail mode in the upstream action.
    #
    # Requires the SSH agent loaded by the webfactory/ssh-agent step above
    # (SSH_AUTH_SOCK is in GITHUB_ENV, so it persists into this step).
    - name: Verify push landed on Pantheon
      shell: bash
      env:
        TERMINUS_MACHINE_TOKEN: ${{ inputs.machine_token }}
        SITE: ${{ inputs.site }}
        TARGET_ENV: ${{ inputs.target_env }}
      run: |
        set -euo pipefail
        LOCAL_HEAD=$(git rev-parse HEAD)
        PANTHEON_GIT_URL=$(terminus connection:info "${SITE}.${TARGET_ENV}" --field=git_url)
        if [[ -z "${PANTHEON_GIT_URL}" ]]; then
          echo "::error::Could not determine Pantheon git URL for ${SITE}.${TARGET_ENV}; cannot verify push."
          exit 1
        fi
        # Pantheon's `dev` environment lives on the `master` branch in the
        # Pantheon-side git repo; multidevs use a branch with the same name as
        # the env. Matches upstream push-to-pantheon's push-target logic
        # (scripts/main.sh:369-378). Without this mapping, dev deploys
        # false-fail here because ls-remote refs/heads/dev returns empty.
        if [[ "${TARGET_ENV}" == "dev" ]]; then
          PANTHEON_BRANCH="master"
        else
          PANTHEON_BRANCH="${TARGET_ENV}"
        fi
        echo "Local HEAD:        ${LOCAL_HEAD}"
        echo "Pantheon URL:      ${PANTHEON_GIT_URL}"
        echo "Pantheon branch:   ${PANTHEON_BRANCH}"
        # Retry ls-remote a few times: for freshly created multidevs there can
        # be a short window where Pantheon has accepted the push but the ref
        # isn't yet visible via ls-remote (related to the propagation race the
        # post-deploy drush step also defends against). Three attempts with
        # short backoff covers the typical lag without papering over a real
        # silent-fail.
        REMOTE_HEAD=""
        for attempt in 1 2 3; do
          REMOTE_HEAD=$(git ls-remote "${PANTHEON_GIT_URL}" "refs/heads/${PANTHEON_BRANCH}" | awk '{print $1}')
          if [[ -n "${REMOTE_HEAD}" ]]; then
            break
          fi
          if [[ ${attempt} -lt 3 ]]; then
            SLEEP=$((attempt * 5))
            echo "ls-remote returned no ref on attempt ${attempt}; retrying in ${SLEEP}s (Pantheon ref propagation lag)..."
            sleep "${SLEEP}"
          fi
        done
        echo "Pantheon HEAD: ${REMOTE_HEAD:-<empty>}"
        if [[ -z "${REMOTE_HEAD}" ]]; then
          echo "::error::Pantheon ${TARGET_ENV} has no commits on refs/heads/${PANTHEON_BRANCH} after 3 attempts. The upstream push silently failed or the branch was never created."
          echo "::error::Check the previous step's output for 'remote rejected' / 'pre-receive hook declined' / SFTP-mode notices."
          exit 1
        fi
        if [[ "${LOCAL_HEAD}" != "${REMOTE_HEAD}" ]]; then
          echo "::error::Pantheon ${TARGET_ENV} (branch ${PANTHEON_BRANCH}) is at ${REMOTE_HEAD}, expected ${LOCAL_HEAD}. The upstream push silently failed."
          echo "::error::Check the previous step's output for 'remote rejected' / 'pre-receive hook declined' / SFTP-mode notices."
          exit 1
        fi
        echo "✅ Pantheon ${TARGET_ENV} (branch ${PANTHEON_BRANCH}) is at ${LOCAL_HEAD} as expected."

    # Replaces upstream's "Update deployment status". Runs after verify-after-push
    # (upstream's ran before it), so a silently rejected push now shows as a
    # failed deployment instead of a green one. Best-effort, like the start step.
    - name: Finish GitHub deployment
      if: ${{ always() && env.GITHUB_DEPLOYMENT_ID != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        JOB_STATUS: ${{ job.status }}
        ENV_URL: https://${{ inputs.target_env }}-${{ inputs.site }}.pantheonsite.io
        LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        case "$JOB_STATUS" in
          success)   STATE=success ;;
          cancelled) STATE=inactive ;;
          *)         STATE=failure ;;
        esac
        gh api -X POST "repos/${REPO}/deployments/${GITHUB_DEPLOYMENT_ID}/statuses" \
          -f state="$STATE" -f environment_url="$ENV_URL" -f log_url="$LOG_URL" \
          -F auto_inactive=true --silent \
          && echo "GitHub deployment ${GITHUB_DEPLOYMENT_ID} marked ${STATE}." \
          || echo "::warning::Could not update GitHub deployment ${GITHUB_DEPLOYMENT_ID} to ${STATE}."
