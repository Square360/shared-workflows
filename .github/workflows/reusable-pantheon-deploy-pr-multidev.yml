name: Reusable Deploy to PR Multidev (Pantheon)

# -----------------------------------------------------------------------------
# Deploys the PR's branch to a Pantheon multidev named pr-<NUMBER> (the GitHub
# PR number). Triggered by PR open / push events on the consumer side.
#
# Defaults:
#   - source_env: dev (PR multidevs are always cloned from dev)
#   - ClickUp comment label: "WIP Multidev"
#   - GitHub PR comment with the multidev URL
#   - Security scan: opt-in via [run-security] (or legacy [security]) in PR body
#   - VRT: opt-in via the --run-vrt PR label (preferred) or [run-vrt]/[vrt] in PR body
#
# Opt-out flags in PR body:
#   - skip-multidev (label or [skip-multidev] body tag): skip the multidev build
#     entirely (static checks elsewhere still run)
#   - docs-only (label or [docs-only] body tag): skip multidev + security scan +
#     VRT (no runtime test needed)
#
# Labels are live PR state: they work on every pull_request event (including
# closed) and adding --run-vrt / --run-security to an open PR triggers a fresh run
# by itself when the caller includes `labeled` in its pull_request trigger
# types. Body tags are event-payload snapshots kept for back-compat — they must
# exist at event time (a body edit after the last push is invisible until the
# next event).
# -----------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      pantheon_site:
        description: 'Pantheon site machine name'
        required: true
        type: string
      slack_channel:
        description: 'Slack channel for notifications (e.g. #deployments)'
        required: false
        type: string
      workflow_skip_terminus:
        description: 'Skip post-deployment Terminus commands (updb, cim, cache rebuild)'
        required: false
        type: boolean
        default: false
      run_php_quality:
        description: 'Run the php-quality check (class-load + custom unit suites) alongside the deploy. Default on.'
        required: false
        type: boolean
        default: true
      php_quality_exclude_classes:
        description: 'Space-separated fully-qualified class names for php-quality to skip (known-broken legacy classes — pair each exclusion with the ticket that removes it)'
        required: false
        type: string
        default: ''
      php_quality_php_version:
        description: 'PHP version for the php-quality check (match production / pantheon.yml)'
        required: false
        type: string
        default: '8.3'
      run_route_smoke:
        description: 'Run authenticated route-smoke against the deployed pr-N multidev. Default on; self-skips with a notice when the repo has no .github/smoke-routes.txt.'
        required: false
        type: boolean
        default: true
      clickup_comment:
        description: 'Forwarded to the VRT and security-scan jobs: post their summaries to the resolved ClickUp task. Default false (S360-1077).'
        required: false
        type: boolean
        default: false
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true
        description: '1Password service account token — loads all CI secrets from s360-cicd vault'

defaults:
  run:
    shell: bash

jobs:
  deploy_pr_multidev:
    name: Deploy to PR Multidev
    # Skip if the developer opted out via the --skip-multidev / --docs-only PR labels
    # (preferred — live state) or the legacy [skip-multidev] / [docs-only] body tags.
    # labeled-event guard: a `labeled` event starts a run only when the added label
    # is one of the opt-in labels (--run-vrt / --run-security) on a still-open PR —
    # any other label addition is a no-op for this workflow.
    if: >-
      ${{
        !contains(github.event.pull_request.labels.*.name, '--skip-multidev') &&
        !contains(github.event.pull_request.labels.*.name, '--docs-only') &&
        !contains(github.event.pull_request.body, '[skip-multidev]') &&
        !contains(github.event.pull_request.body, '[docs-only]') &&
        (
          github.event.action != 'labeled' ||
          (
            github.event.pull_request.state == 'open' &&
            (github.event.label.name == '--run-vrt' || github.event.label.name == '--run-security')
          )
        )
      }}
    permissions:
      deployments: write
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.derive.outputs.target_env }}
      multidev_url: ${{ steps.multidev_url.outputs.url }}
      env_is_new: ${{ steps.check_env.outputs.env_is_new }}
      error_message: ${{ steps.capture_error.outputs.error_message }}
      failed_step: ${{ steps.capture_error.outputs.failed_step }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure 1Password
        uses: 1password/load-secrets-action/configure@v5
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load secrets
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          PANTHEON_MACHINE_TOKEN: op://s360-cicd/pantheon/machine-token
          PANTHEON_SSH_KEY: op://s360-cicd/pantheon/ssh-key
          CLICKUP_API_TOKEN: op://s360-cicd/clickup/api-token
          CLICKUP_TEAM_ID: op://s360-cicd/clickup/team-id

      - name: Derive multidev name from PR number
        id: derive
        run: echo "target_env=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Install Terminus
        uses: Square360/shared-workflows/.github/actions/terminus-install@4342823f58612cc70fba04424df7d78758493141  # v4.3.0
        with:
          machine_token: ${{ env.PANTHEON_MACHINE_TOKEN }}

      - name: Check if multidev environment exists
        id: check_env
        env:
          TERMINUS_MACHINE_TOKEN: ${{ env.PANTHEON_MACHINE_TOKEN }}
          SITE: ${{ inputs.pantheon_site }}
          TARGET_ENV: ${{ steps.derive.outputs.target_env }}
        run: |
          echo "Checking if ${SITE}.${TARGET_ENV} exists..."
          if terminus env:info "${SITE}.${TARGET_ENV}" >/dev/null 2>&1; then
            echo "env_is_new=false" >> $GITHUB_OUTPUT
            echo "Multidev exists, ClickUp comment will say 'updated'"
          else
            echo "env_is_new=true" >> $GITHUB_OUTPUT
            echo "Multidev is new, ClickUp comment will say 'created'"
          fi

      - name: Push code to Pantheon multidev
        id: deploy
        uses: Square360/shared-workflows/.github/actions/pantheon-push@4342823f58612cc70fba04424df7d78758493141  # v4.3.0
        with:
          site: ${{ inputs.pantheon_site }}
          target_env: ${{ steps.derive.outputs.target_env }}
          source_env: dev
          ssh_key: ${{ env.PANTHEON_SSH_KEY }}
          machine_token: ${{ env.PANTHEON_MACHINE_TOKEN }}
          commit_message: 'Automated deployment from GitHub Actions to multidev ${{ steps.derive.outputs.target_env }}'

      - name: Run post-deploy drush commands
        id: drush_commands
        uses: Square360/shared-workflows/.github/actions/pantheon-post-deploy-drush@4342823f58612cc70fba04424df7d78758493141  # v4.3.0
        with:
          site: ${{ inputs.pantheon_site }}
          env: ${{ steps.derive.outputs.target_env }}
          machine_token: ${{ env.PANTHEON_MACHINE_TOKEN }}
          skip: ${{ inputs.workflow_skip_terminus }}
          pr_title: ${{ github.event.pull_request.title }}

      - name: Get multidev URL
        id: multidev_url
        env:
          TERMINUS_MACHINE_TOKEN: ${{ env.PANTHEON_MACHINE_TOKEN }}
          SITE: ${{ inputs.pantheon_site }}
          TARGET_ENV: ${{ steps.derive.outputs.target_env }}
        run: |
          URL=$(terminus env:view "${SITE}.${TARGET_ENV}" --print)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Multidev available at: $URL"

      - name: Comment on ClickUp task with multidev URL
        continue-on-error: true
        env:
          CLICKUP_API_TOKEN: ${{ env.CLICKUP_API_TOKEN }}
          CLICKUP_TEAM_ID: ${{ env.CLICKUP_TEAM_ID }}
          MULTIDEV_URL: ${{ steps.multidev_url.outputs.url }}
          TARGET_ENV: ${{ steps.derive.outputs.target_env }}
          ENV_IS_NEW: ${{ steps.check_env.outputs.env_is_new }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          SITE: ${{ inputs.pantheon_site }}
        run: |
          if [[ -z "$CLICKUP_API_TOKEN" || -z "$CLICKUP_TEAM_ID" ]]; then
            echo "CLICKUP_API_TOKEN or CLICKUP_TEAM_ID not set, skipping ClickUp comment"
            exit 0
          fi
          TASK_ID=$(echo "$BRANCH $PR_TITLE" | grep -oP '[A-Z][A-Z0-9]+-[0-9]+' | head -1 || true)
          if [[ -z "$TASK_ID" ]]; then
            echo "No ClickUp task ID found in branch or PR title, skipping comment"
            exit 0
          fi
          echo "Found ClickUp task ID: $TASK_ID"
          ACTION=$([[ "$ENV_IS_NEW" == "true" ]] && echo "created" || echo "updated")
          PR_LINE=""
          if [[ -n "$PR_NUMBER" ]]; then
            PR_LINE="\nPull Request: https://github.com/${REPO}/pull/${PR_NUMBER}"
          fi
          RESPONSE=$(curl -s -o /tmp/clickup_response.json -w "%{http_code}" -X POST \
            "https://api.clickup.com/api/v2/task/${TASK_ID}/comment?custom_task_ids=true&team_id=${CLICKUP_TEAM_ID}" \
            -H "Authorization: ${CLICKUP_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"comment_text\": \"The WIP Multidev environment was ${ACTION}: ${MULTIDEV_URL}\n\nEnvironment: ${TARGET_ENV}\nSite: ${SITE}${PR_LINE}\"}" || true)
          echo "ClickUp API response code: $RESPONSE"
          cat /tmp/clickup_response.json || true
          if [[ "$RESPONSE" != "200" ]]; then
            echo "Warning: ClickUp comment may not have been posted (HTTP $RESPONSE)"
          fi

      - name: Comment on PR with multidev URL
        # Gate on success() so the "🚀 Multidev Environment Ready!" comment
        # doesn't get posted when the deploy actually failed — including the
        # case where pantheon-push's verify-after-push step caught the
        # upstream action's silent-fail mode (SFTP-mode rejection, etc.).
        if: ${{ success() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          script: |
            const url = '${{ steps.multidev_url.outputs.url }}';
            const targetEnv = '${{ steps.derive.outputs.target_env }}';
            const site = '${{ inputs.pantheon_site }}';
            const comment = `🚀 **Multidev Environment Ready!**

            Your changes have been deployed to: <a href="${url}" target="_blank">${url}</a>

            Environment: \`${targetEnv}\`
            Site: \`${site}\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Capture error information
        id: capture_error
        if: ${{ failure() }}
        run: |
          if [[ "${{ steps.deploy.conclusion }}" == "failure" ]]; then
            echo "failed_step=PR Multidev Deployment" >> $GITHUB_OUTPUT
            echo "error_message=Failed to deploy to PR multidev. Check deployment logs." >> $GITHUB_OUTPUT
          elif [[ "${{ steps.drush_commands.conclusion }}" == "failure" ]]; then
            echo "failed_step=Drush Commands" >> $GITHUB_OUTPUT
            echo "error_message=Failed to run drush updb/cim/cr on PR multidev." >> $GITHUB_OUTPUT
          elif [[ "${{ steps.multidev_url.conclusion }}" == "failure" ]]; then
            echo "failed_step=Multidev URL" >> $GITHUB_OUTPUT
            echo "error_message=Failed to retrieve multidev URL from Pantheon." >> $GITHUB_OUTPUT
          else
            echo "failed_step=Unknown" >> $GITHUB_OUTPUT
            echo "error_message=PR multidev deployment failed at an unknown step." >> $GITHUB_OUTPUT
          fi

  php_quality:
    name: PHP Quality
    # Class-loads every custom plugin class + runs custom-module Unit suites on
    # the runner (no Pantheon dependency — runs parallel to the deploy).
    # Catches typed-signature fatals against bumped contrib base classes that
    # green deploys and watchdog both miss (som.yale.edu 2026-08-18 incident).
    if: ${{ inputs.run_php_quality }}
    uses: Square360/shared-workflows/.github/workflows/reusable-php-quality.yml@3222fcb5a9802cf45f1d427dffc0cfc6908ba694  # v4.7.0
    with:
      php_version: ${{ inputs.php_quality_php_version }}
      exclude_classes: ${{ inputs.php_quality_exclude_classes }}

  route_smoke:
    name: Route Smoke
    # Authenticated key-route sweep (drush uli) against the freshly-deployed
    # pr-N multidev — catches admin-only fatals invisible to anonymous probes.
    # Self-skips with a visible notice when the repo has no smoke-routes.txt.
    needs: deploy_pr_multidev
    if: ${{ inputs.run_route_smoke }}
    uses: Square360/shared-workflows/.github/workflows/reusable-route-smoke.yml@12edc3ff2b7618d5ee3a5bedb22778894a8aaef8  # v4.8.2 — uli account from ROUTE_SMOKE_ULI_OPTIONS repo/org var
    with:
      pantheon_site: ${{ inputs.pantheon_site }}
      target_env: ${{ needs.deploy_pr_multidev.outputs.target_env }}
      slack_channel: ${{ inputs.slack_channel }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  security_scan:
    name: Security Scan (opt-in)
    needs: deploy_pr_multidev
    # Opt-in via the --run-security PR label (preferred — live state, one-click
    # re-trigger via the labeled event) or the legacy [run-security]/[security]
    # body tags.
    if: >-
      ${{
        contains(github.event.pull_request.labels.*.name, '--run-security') ||
        contains(github.event.pull_request.body, '[run-security]') ||
        contains(github.event.pull_request.body, '[security]')
      }}
    uses: Square360/shared-workflows/.github/workflows/reusable-pantheon-security-scan.yml@v4  # moving major tag — advances with each 4.x release
    with:
      clickup_comment: ${{ inputs.clickup_comment }}
      pantheon_site: ${{ inputs.pantheon_site }}
      target_env: ${{ needs.deploy_pr_multidev.outputs.target_env }}
      slack_channel: ${{ inputs.slack_channel }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  visual_regression:
    name: Visual Regression (opt-in)
    needs: deploy_pr_multidev
    # Opt-in via the --run-vrt PR label (preferred — live state, one-click
    # re-trigger via the labeled event) or the legacy [run-vrt]/[vrt] body tags.
    if: >-
      ${{
        contains(github.event.pull_request.labels.*.name, '--run-vrt') ||
        contains(github.event.pull_request.body, '[run-vrt]') ||
        contains(github.event.pull_request.body, '[vrt]')
      }}
    uses: Square360/shared-workflows/.github/workflows/reusable-pantheon-vrt.yml@v4  # moving major tag — advances with each 4.x release
    with:
      clickup_comment: ${{ inputs.clickup_comment }}
      pantheon_site: ${{ inputs.pantheon_site }}
      target_env: ${{ needs.deploy_pr_multidev.outputs.target_env }}
      slack_channel: ${{ inputs.slack_channel }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  notify_slack:
    name: Notify Slack
    needs: deploy_pr_multidev
    if: ${{ always() && inputs.slack_channel }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure 1Password
        uses: 1password/load-secrets-action/configure@v5
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load secrets
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          SLACK_BOT_TOKEN: op://s360-cicd/slack/bot-token

      - name: Send Slack notification
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ inputs.slack_channel }}
          DEPLOY_RESULT: ${{ needs.deploy_pr_multidev.result }}
          MULTIDEV_URL: ${{ needs.deploy_pr_multidev.outputs.multidev_url }}
          TARGET_ENV: ${{ needs.deploy_pr_multidev.outputs.target_env }}
          FAILED_STEP: ${{ needs.deploy_pr_multidev.outputs.failed_step }}
          ERROR_MESSAGE: ${{ needs.deploy_pr_multidev.outputs.error_message }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          SITE: ${{ inputs.pantheon_site }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ -z "$SLACK_BOT_TOKEN" ]]; then
            echo "SLACK_BOT_TOKEN not provided, skipping Slack notification"
            exit 0
          fi

          # Status decoding
          case "$DEPLOY_RESULT" in
            success)   STATUS_EMOJI=":white_check_mark:"; STATUS_COLOR="good";    STATUS_TEXT="Success"   ;;
            failure)   STATUS_EMOJI=":x:";                STATUS_COLOR="danger";  STATUS_TEXT="Failed"    ;;
            cancelled) STATUS_EMOJI=":warning:";          STATUS_COLOR="warning"; STATUS_TEXT="Cancelled" ;;
            skipped)   STATUS_EMOJI=":fast_forward:";     STATUS_COLOR="#808080"; STATUS_TEXT="Skipped"   ;;
            *)         STATUS_EMOJI=":question:";         STATUS_COLOR="#808080"; STATUS_TEXT="Unknown"   ;;
          esac

          ENV_URL_FIELD=""
          if [[ "$DEPLOY_RESULT" == "success" && -n "$MULTIDEV_URL" ]]; then
            ENV_URL_FIELD=",{\"title\": \"Multidev URL\", \"value\": \"<${MULTIDEV_URL}|${MULTIDEV_URL}>\", \"short\": false}"
          fi

          PR_FIELD=""
          if [[ -n "$PR_NUMBER" ]]; then
            PR_TITLE_ESCAPED=$(printf '%s' "$PR_TITLE" | jq -Rs .)
            PR_FIELD=",{\"title\": \"Pull Request\", \"value\": \"<https://github.com/${REPO}/pull/${PR_NUMBER}|#${PR_NUMBER}>\", \"short\": false},{\"title\": \"PR Title\", \"value\": ${PR_TITLE_ESCAPED}, \"short\": false}"
          fi

          ERROR_FIELD=""
          if [[ "$DEPLOY_RESULT" == "failure" && -n "$FAILED_STEP" && -n "$ERROR_MESSAGE" ]]; then
            FAILED_STEP_ESCAPED=$(printf '%s' "$FAILED_STEP" | jq -Rs .)
            ERROR_MSG_ESCAPED=$(printf '%s' "$ERROR_MESSAGE" | jq -Rs .)
            ERROR_FIELD=",{\"title\": \"Failed Step\", \"value\": ${FAILED_STEP_ESCAPED}, \"short\": true},{\"title\": \"Error Details\", \"value\": ${ERROR_MSG_ESCAPED}, \"short\": false}"
          fi

          curl -X POST -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "{
              \"channel\": \"${SLACK_CHANNEL}\",
              \"text\": \"${STATUS_EMOJI} PR Multidev Deployment ${STATUS_TEXT}\",
              \"attachments\": [
                {
                  \"color\": \"${STATUS_COLOR}\",
                  \"fields\": [
                    {\"title\": \"Repository\", \"value\": \"${REPO}\", \"short\": true},
                    {\"title\": \"Environment\", \"value\": \"${TARGET_ENV}\", \"short\": true},
                    {\"title\": \"Site\", \"value\": \"${SITE}\", \"short\": true},
                    {\"title\": \"Status\", \"value\": \"${STATUS_TEXT}\", \"short\": true},
                    {\"title\": \"Workflow\", \"value\": \"<https://github.com/${REPO}/actions/runs/${RUN_ID}|View Workflow>\", \"short\": false}
                    ${ENV_URL_FIELD}
                    ${PR_FIELD}
                    ${ERROR_FIELD}
                  ],
                  \"footer\": \"GitHub Actions\",
                  \"ts\": $(date +%s)
                }
              ]
            }" \
            https://slack.com/api/chat.postMessage
