name: Sweep stale GitHub environments

# -----------------------------------------------------------------------------
# Deletes GitHub deployment environments left behind by multidev deploys
# (issue #164): pr-N for closed PRs, rc-YYYY-WW from past weeks. Keeps
# everything else, epr-* included. GitHub records only: Pantheon multidevs are
# never touched (their lifecycle stays manual).
#
# Runs as the "Square360 Env Sweeper" App (Actions: read to list
# environments, Administration: write to delete, Pull requests: read),
# installed on all Square360 repos. Its key is used by this workflow only;
# the Square360 CI App stays contents-only.
#
# Scheduled runs only report until the repository variable ENV_SWEEP_DELETE is
# set to "true". Manual runs default to dry run. PRs touching the sweep always
# dry-run. Repos to leave alone, and outside repos to report on, are in
# .github/env-sweep.json.
# -----------------------------------------------------------------------------

on:
  schedule:
    - cron: '0 11 * * 1'   # Mondays 11:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be deleted without deleting'
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/sweep-stale-environments.yml'
      - '.github/scripts/sweep_environments.py'
      - '.github/env-sweep.json'

permissions:
  contents: read

concurrency:
  group: sweep-stale-environments
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sweep:
    name: Sweep
    runs-on: ${{ vars.S360_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure 1Password
        uses: 1password/load-secrets-action/configure@v5
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load secrets
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          SWEEPER_APP_PRIVATE_KEY: op://s360-cicd/github-app-env-sweeper/private-key
          CLICKUP_API_TOKEN: op://s360-cicd/clickup/api-token
          CLICKUP_TEAM_ID: op://s360-cicd/clickup/team-id

      # Permission check 1: asking for exactly these permissions makes the mint
      # fail here, before any repo is touched, if the App doesn't have them.
      # The Client ID is public (the App's OAuth identifier, not a credential).
      - name: Mint sweeper App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liBdf82AGbhimSoU
          private-key: ${{ env.SWEEPER_APP_PRIVATE_KEY }}
          owner: Square360
          permission-actions: read
          permission-administration: write
          permission-pull-requests: read

      - name: Sweep
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONFIG: .github/env-sweep.json
          CHAT_MESSAGE_FILE: ${{ runner.temp }}/chat-message.md
          DRY_RUN: >-
            ${{ github.event_name == 'pull_request' && 'true'
             || github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false')
             || (vars.ENV_SWEEP_DELETE == 'true' && 'false' || 'true') }}
        run: python3 .github/scripts/sweep_environments.py

      # Posts to the "systems_monitoring" ClickUp channel when something was
      # deleted or went wrong; quiet weeks and PR dry runs post nothing.
      - name: Read chat message
        id: chat
        if: always() && github.event_name != 'pull_request'
        run: |
          f="${RUNNER_TEMP}/chat-message.md"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ ! -s "$f" && "${{ job.status }}" == "failure" ]]; then
            # Failed before the sweep wrote anything (secrets, token mint).
            printf '**Stale GitHub environment sweep failed** before it could run (secrets or App token step).\n[Run](%s)\n' "$RUN_URL" > "$f"
          fi
          if [[ -s "$f" ]]; then
            { echo "body<<CHAT_EOF"; cat "$f"; echo "CHAT_EOF"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Post to systems_monitoring
        if: always() && steps.chat.outputs.body != ''
        uses: ./.github/actions/clickup-notify
        with:
          channel_id: '12b9zb-90951'
          token: ${{ env.CLICKUP_API_TOKEN }}
          workspace_id: ${{ env.CLICKUP_TEAM_ID }}
          message: ${{ steps.chat.outputs.body }}
