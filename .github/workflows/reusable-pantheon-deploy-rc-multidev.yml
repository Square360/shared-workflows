name: Reusable Deploy to RC Multidev (Pantheon)

# -----------------------------------------------------------------------------
# Deploys the develop branch to a Pantheon multidev named rc-<YYYY>-<WW> (ISO
# year and week). Triggered on the consumer side by pushes/merges to develop.
# Only real merges deploy: closed PRs with merged_by:null (GitHub-inferred merges
# of subset PRs) are skipped, and deploys serialise per site (S360-1079).
# Multiple merges in the same ISO week share the same multidev.
#
# Defaults:
#   - source_env: live if it exists, otherwise dev (so the RC reflects what's
#                 currently in production, not what's in dev)
#   - ClickUp comment: skipped (rc-multidev triggers are push events, no PR
#                      context to extract a task ID from)
#   - Security scan: MANDATORY (force_run=true). The release-candidate gate.
#   - Composer audit: MANDATORY. `composer audit` on develop's composer.lock,
#          run on the runner in parallel with the deploy. Fails the workflow on
#          any drupal/* advisory (Drupal SAs carry no exploitability tiers —
#          every one is a public how-to) and on other packages at
#          composer_audit_min_severity or above (default high). The deploy
#          itself still runs so the RC reflects develop; the red run and the
#          Slack line are the gate. Escape hatch: composer_audit_gate=false
#          downgrades to warn-only. pr-* multidevs keep the caller template's
#          warn-only sticky comment; this is the rc-* teeth (S360-936).
#   - VRT: opt-in via the --run-vrt PR label (preferred; present on the merged-PR
#          closed payload), the [run-vrt]/[vrt] PR-body tags, or the merge
#          commit message on develop (push wiring). All channels are checked;
#          absent ones are null-safe. The label must be on the PR by merge
#          time — the RC path runs once, at the closed event.
#
#   - Skip labels: --docs-only or --skip-multidev on the merged PR (or the
#          legacy [docs-only] / [skip-multidev] body tags) skips the RC
#          redeploy. Documentation and developer-tooling PRs change nothing
#          on Pantheon; they belong in develop, not on the RC multidev.
#          Labels ride the closed payload, so this is live state at merge
#          time. The skip is reported to Slack so a mislabeled code PR is
#          visible rather than a silent stale RC.
# -----------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      pantheon_site:
        description: 'Pantheon site machine name'
        required: true
        type: string
      slack_channel:
        description: 'Slack channel for notifications (e.g. #deployments)'
        required: false
        type: string
      workflow_skip_terminus:
        description: 'Skip post-deployment Terminus commands (updb, cim, cache rebuild)'
        required: false
        type: boolean
        default: false
      run_route_smoke:
        description: 'Run route-smoke on the RC before the security scan. The RC is the first build of the merged aggregate — individual PR multidevs only prove each branch alone — so this defaults on. Set false only for repos whose route inventory cannot be made reliable.'
        required: false
        type: boolean
        default: true
      composer_audit_gate:
        description: 'Fail the workflow on blocking composer advisories (drupal/* at any severity, others at composer_audit_min_severity+). false = warn-only.'
        required: false
        type: boolean
        default: true
      composer_audit_min_severity:
        description: 'Minimum severity that blocks for non-drupal packages: low | medium | high | critical.'
        required: false
        type: string
        default: 'high'
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true
        description: '1Password service account token — loads all CI secrets from s360-cicd vault'

defaults:
  run:
    shell: bash

jobs:
  deploy_rc_multidev:
    name: Deploy to RC Multidev
    # Skip when the merged PR is docs or developer tooling (--docs-only /
    # --skip-multidev labels, or the legacy body tags). Downstream jobs `needs`
    # this one and skip with it; notify_slack reports the skip.
    # merged_by guard (S360-1079, #140): a PR GitHub auto-closes because its
    # commits landed through another PR is merged:true with merged_by:null. It
    # carries no new code and must not start a second RC deploy that races the
    # real one. Null-safe for the push wiring (no PR payload).
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.merged_by != null) &&
      !contains(github.event.pull_request.labels.*.name, '--docs-only') &&
      !contains(github.event.pull_request.labels.*.name, '--skip-multidev') &&
      !contains(github.event.pull_request.body, '[docs-only]') &&
      !contains(github.event.pull_request.body, '[skip-multidev]')
    # One RC deploy per site at a time. Two merges landing in the same minute
    # (or a real merge plus an inferred one on an older caller) queue instead of
    # racing the git push to the same rc-* env; never cancel, the later run may
    # be the one carrying the new code (S360-1079, #140).
    concurrency:
      group: rc-multidev-${{ inputs.pantheon_site }}
      cancel-in-progress: false
    permissions:
      deployments: write
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.derive.outputs.target_env }}
      multidev_url: ${{ steps.multidev_url.outputs.url }}
      error_message: ${{ steps.capture_error.outputs.error_message }}
      failed_step: ${{ steps.capture_error.outputs.failed_step }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Configure 1Password
        uses: 1password/load-secrets-action/configure@v5
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load secrets
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          PANTHEON_MACHINE_TOKEN: op://s360-cicd/pantheon/machine-token
          PANTHEON_SSH_KEY: op://s360-cicd/pantheon/ssh-key

      - name: Derive multidev name from ISO week
        id: derive
        run: |
          # ISO 8601 year-week. %G gives ISO year (may differ from calendar year
          # near Jan/Dec boundaries); %V gives ISO week number with zero-pad.
          TARGET_ENV="rc-$(date -u +'%G-%V')"
          echo "target_env=${TARGET_ENV}" >> $GITHUB_OUTPUT
          echo "Derived RC multidev name: ${TARGET_ENV}"

      - name: Install Terminus
        uses: Square360/shared-workflows/.github/actions/terminus-install@4342823f58612cc70fba04424df7d78758493141  # v4.3.0
        with:
          machine_token: ${{ env.PANTHEON_MACHINE_TOKEN }}

      - name: Determine source environment
        id: source_env
        env:
          TERMINUS_MACHINE_TOKEN: ${{ env.PANTHEON_MACHINE_TOKEN }}
          SITE: ${{ inputs.pantheon_site }}
        run: |
          # RC multidevs prefer live as the source (so the RC starts from the
          # current production state and the merged changes apply on top). Fall
          # back to dev if live doesn't exist yet (e.g. a new site pre-launch).
          if terminus env:list "${SITE}" --format=list | grep -q "^live$"; then
            echo "source_env=live" >> $GITHUB_OUTPUT
            echo "Using 'live' as source environment"
          else
            echo "source_env=dev" >> $GITHUB_OUTPUT
            echo "'live' environment not found, falling back to 'dev'"
          fi

      - name: Push code to Pantheon multidev
        id: deploy
        uses: Square360/shared-workflows/.github/actions/pantheon-push@4342823f58612cc70fba04424df7d78758493141  # v4.3.0
        with:
          site: ${{ inputs.pantheon_site }}
          target_env: ${{ steps.derive.outputs.target_env }}
          source_env: ${{ steps.source_env.outputs.source_env }}
          ssh_key: ${{ env.PANTHEON_SSH_KEY }}
          machine_token: ${{ env.PANTHEON_MACHINE_TOKEN }}
          commit_message: 'Automated deployment from GitHub Actions to RC multidev ${{ steps.derive.outputs.target_env }}'

      - name: Run post-deploy drush commands
        id: drush_commands
        uses: Square360/shared-workflows/.github/actions/pantheon-post-deploy-drush@4342823f58612cc70fba04424df7d78758493141  # v4.3.0
        with:
          site: ${{ inputs.pantheon_site }}
          env: ${{ steps.derive.outputs.target_env }}
          machine_token: ${{ env.PANTHEON_MACHINE_TOKEN }}
          skip: ${{ inputs.workflow_skip_terminus }}
          # No pr_title for push events; [verbose] flag doesn't apply here.
          pr_title: ''

      - name: Get multidev URL
        id: multidev_url
        env:
          TERMINUS_MACHINE_TOKEN: ${{ env.PANTHEON_MACHINE_TOKEN }}
          SITE: ${{ inputs.pantheon_site }}
          TARGET_ENV: ${{ steps.derive.outputs.target_env }}
        run: |
          URL=$(terminus env:view "${SITE}.${TARGET_ENV}" --print)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "RC multidev available at: $URL"

      - name: Capture error information
        id: capture_error
        if: ${{ failure() }}
        run: |
          if [[ "${{ steps.deploy.conclusion }}" == "failure" ]]; then
            echo "failed_step=RC Multidev Deployment" >> $GITHUB_OUTPUT
            echo "error_message=Failed to deploy to RC multidev. Check deployment logs." >> $GITHUB_OUTPUT
          elif [[ "${{ steps.drush_commands.conclusion }}" == "failure" ]]; then
            echo "failed_step=Drush Commands" >> $GITHUB_OUTPUT
            echo "error_message=Failed to run drush updb/cim/cr on RC multidev." >> $GITHUB_OUTPUT
          elif [[ "${{ steps.multidev_url.conclusion }}" == "failure" ]]; then
            echo "failed_step=Multidev URL" >> $GITHUB_OUTPUT
            echo "error_message=Failed to retrieve RC multidev URL from Pantheon." >> $GITHUB_OUTPUT
          else
            echo "failed_step=Unknown" >> $GITHUB_OUTPUT
            echo "error_message=RC multidev deployment failed at an unknown step." >> $GITHUB_OUTPUT
          fi

  composer_audit:
    name: Composer security audit (RC gate)
    # Same skip as the deploy: a docs/tooling merge is not a release candidate,
    # and neither is an inferred merge (merged_by:null).
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.merged_by != null) &&
      !contains(github.event.pull_request.labels.*.name, '--docs-only') &&
      !contains(github.event.pull_request.labels.*.name, '--skip-multidev') &&
      !contains(github.event.pull_request.body, '[docs-only]') &&
      !contains(github.event.pull_request.body, '[skip-multidev]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      advisory_count: ${{ steps.audit.outputs.advisory_count }}
      drupal_count: ${{ steps.audit.outputs.drupal_count }}
      blocking_count: ${{ steps.audit.outputs.blocking_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Run composer audit
        id: audit
        env:
          GATE: ${{ inputs.composer_audit_gate }}
          MIN_SEVERITY: ${{ inputs.composer_audit_min_severity }}
        run: |
          set -euo pipefail
          if [[ ! -f composer.lock ]]; then
            echo "No composer.lock — nothing to audit."
            for k in advisory_count drupal_count blocking_count; do echo "$k=0" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi

          # --locked audits composer.lock directly: this job never runs composer install,
          # so without it composer reports "No installed packages found" and exits 1.
          # composer audit exits non-zero when advisories exist; we decide below.
          set +e
          composer audit --locked --format=json --no-interaction > composer-audit.json 2>composer-audit.err
          AUDIT_EXIT=$?
          set -e
          if [[ ! -s composer-audit.json ]]; then
            echo "::error::composer audit produced no JSON (exit $AUDIT_EXIT)"; cat composer-audit.err; exit 1
          fi

          # Severity rank; unknown ranks as high so an unlabelled advisory is not
          # silently waved through. drupal/* blocks at ANY severity.
          rank() { case "${1,,}" in critical) echo 4;; high) echo 3;; medium|moderate) echo 2;; low) echo 1;; *) echo 3;; esac; }
          MIN_RANK=$(rank "$MIN_SEVERITY")

          jq -r '[.advisories // {} | to_entries[] as $e | $e.value[]? | . + {package: $e.key}]
                 | sort_by(.package)[]
                 | [.package, (.severity // "unknown"), (.advisoryId // .cve // "advisory"), (.link // ""), (.title // "")] | @tsv' \
            composer-audit.json > advisories.tsv

          ADVISORY_COUNT=$(wc -l < advisories.tsv | tr -d ' ')
          DRUPAL_COUNT=0; BLOCKING_COUNT=0
          {
            echo "### Composer security audit — release candidate"
            echo ""
            if [[ "$ADVISORY_COUNT" -eq 0 ]]; then
              echo "✅ No known security advisories in \`composer.lock\`."
            else
              echo "| Blocks | Package | Severity | Advisory | Title |"
              echo "|:--:|---|---|---|---|"
            fi
          } > audit-summary.md
          while IFS=$'\t' read -r pkg sev adv link title; do
            [[ -z "$pkg" ]] && continue
            blocks="no"
            if [[ "$pkg" == drupal/* ]]; then
              DRUPAL_COUNT=$((DRUPAL_COUNT+1)); blocks="yes"
            elif [[ $(rank "$sev") -ge $MIN_RANK ]]; then
              blocks="yes"
            fi
            [[ "$blocks" == "yes" ]] && BLOCKING_COUNT=$((BLOCKING_COUNT+1))
            mark=$([[ "$blocks" == "yes" ]] && echo "❌" || echo "⚠️")
            advcell=$adv; [[ -n "$link" ]] && advcell="[$adv]($link)"
            printf '| %s | %s | %s | %s | %s |\n' "$mark" "$pkg" "$sev" "$advcell" "${title//|/\\|}" >> audit-summary.md
          done < advisories.tsv
          {
            echo ""
            echo "- Advisories: $ADVISORY_COUNT (drupal/*: $DRUPAL_COUNT, blocking: $BLOCKING_COUNT)"
            echo "- Rule: drupal/* blocks at any severity; other packages block at **$MIN_SEVERITY** or above."
          } >> audit-summary.md
          cat audit-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat audit-summary.md

          {
            echo "advisory_count=$ADVISORY_COUNT"
            echo "drupal_count=$DRUPAL_COUNT"
            echo "blocking_count=$BLOCKING_COUNT"
          } >> "$GITHUB_OUTPUT"

          if [[ "$BLOCKING_COUNT" -gt 0 ]]; then
            if [[ "$GATE" == "true" ]]; then
              echo "::error::$BLOCKING_COUNT blocking security advisor(y/ies) in composer.lock — release candidate gate failed"
              exit 1
            fi
            echo "::warning::$BLOCKING_COUNT blocking advisor(y/ies) — composer_audit_gate=false, warn-only"
          fi

  route_smoke:
    name: Route Smoke (aggregate gate)
    # The RC is the first build where the merged combination of this cycle's
    # PRs exists — each PR multidev only proved its own branch against develop
    # as of its build. Route-smoke here certifies the AGGREGATE serves its key
    # routes before the security scan spends minutes crawling it: a broken RC
    # fails fast with one clear signal instead of a wall of ZAP noise.
    # Self-skips (visible notice, green) when the consuming repo has no
    # .github/smoke-routes.txt.
    if: ${{ inputs.run_route_smoke }}
    needs: deploy_rc_multidev
    uses: Square360/shared-workflows/.github/workflows/reusable-route-smoke.yml@12edc3ff2b7618d5ee3a5bedb22778894a8aaef8  # v4.8.2 — uli account from ROUTE_SMOKE_ULI_OPTIONS repo/org var
    with:
      pantheon_site: ${{ inputs.pantheon_site }}
      target_env: ${{ needs.deploy_rc_multidev.outputs.target_env }}
      slack_channel: ${{ inputs.slack_channel }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  security_scan:
    name: Security Scan (mandatory on rc-*)
    # Gated on route_smoke: ZAP against a site whose routes are 500ing produces
    # misleading findings — the gate keeps the scan's signal trustworthy. Still
    # runs when route_smoke is disabled via run_route_smoke: false (skipped
    # counts as pass); never runs if route_smoke actually failed.
    needs: [deploy_rc_multidev, route_smoke]
    if: ${{ !cancelled() && needs.deploy_rc_multidev.result == 'success' && (needs.route_smoke.result == 'success' || needs.route_smoke.result == 'skipped') }}
    # The security workflow detects rc-* internally and runs unconditionally
    # in strict mode (fails on any High-severity finding). No force_run needed.
    uses: Square360/shared-workflows/.github/workflows/reusable-pantheon-security-scan.yml@4342823f58612cc70fba04424df7d78758493141  # v4.3.0
    with:
      pantheon_site: ${{ inputs.pantheon_site }}
      target_env: ${{ needs.deploy_rc_multidev.outputs.target_env }}
      slack_channel: ${{ inputs.slack_channel }}
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  visual_regression:
    name: Visual Regression (opt-in)
    needs: deploy_rc_multidev
    # Opt-in via the --run-vrt PR label (preferred — labels ride the payload of
    # every pull_request event including closed), the [run-vrt]/[vrt] PR-body
    # tags, OR the merge/head commit message. Callers trigger this workflow
    # from two event topologies: a push to develop (head_commit populated, no
    # PR payload) or a merged-PR closed event (PR payload populated,
    # head_commit null). Checking all channels makes the opt-in work in either
    # wiring — contains() on an absent field is null-safe and yields false.
    if: >-
      ${{
        contains(github.event.pull_request.labels.*.name, '--run-vrt') ||
        contains(github.event.pull_request.body, '[run-vrt]') ||
        contains(github.event.pull_request.body, '[vrt]') ||
        contains(github.event.head_commit.message, '[run-vrt]') ||
        contains(github.event.head_commit.message, '[vrt]')
      }}
    uses: Square360/shared-workflows/.github/workflows/reusable-pantheon-vrt.yml@v4  # moving major tag — advances with each 4.x release
    with:
      pantheon_site: ${{ inputs.pantheon_site }}
      target_env: ${{ needs.deploy_rc_multidev.outputs.target_env }}
      slack_channel: ${{ inputs.slack_channel }}
      # VRT's internal gate parses [run-vrt] from the PR body — which is empty
      # on push events. We've already gated this job on the commit message
      # above, so tell VRT to skip its own check and just run.
      force_run: true
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

  notify_slack:
    name: Notify Slack
    needs: [deploy_rc_multidev, composer_audit]
    if: ${{ always() && inputs.slack_channel }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure 1Password
        uses: 1password/load-secrets-action/configure@v5
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load secrets
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          SLACK_BOT_TOKEN: op://s360-cicd/slack/bot-token

      - name: Send Slack notification
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ inputs.slack_channel }}
          DEPLOY_RESULT: ${{ needs.deploy_rc_multidev.result }}
          AUDIT_RESULT: ${{ needs.composer_audit.result }}
          AUDIT_ADVISORIES: ${{ needs.composer_audit.outputs.advisory_count }}
          AUDIT_BLOCKING: ${{ needs.composer_audit.outputs.blocking_count }}
          AUDIT_DRUPAL: ${{ needs.composer_audit.outputs.drupal_count }}
          MULTIDEV_URL: ${{ needs.deploy_rc_multidev.outputs.multidev_url }}
          TARGET_ENV: ${{ needs.deploy_rc_multidev.outputs.target_env }}
          FAILED_STEP: ${{ needs.deploy_rc_multidev.outputs.failed_step }}
          ERROR_MESSAGE: ${{ needs.deploy_rc_multidev.outputs.error_message }}
          REPO: ${{ github.repository }}
          SITE: ${{ inputs.pantheon_site }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [[ -z "$SLACK_BOT_TOKEN" ]]; then
            echo "SLACK_BOT_TOKEN not provided, skipping Slack notification"
            exit 0
          fi

          case "$DEPLOY_RESULT" in
            success)   STATUS_EMOJI=":white_check_mark:"; STATUS_COLOR="good";    STATUS_TEXT="Success"   ;;
            failure)   STATUS_EMOJI=":x:";                STATUS_COLOR="danger";  STATUS_TEXT="Failed"    ;;
            cancelled) STATUS_EMOJI=":warning:";          STATUS_COLOR="warning"; STATUS_TEXT="Cancelled" ;;
            skipped)   STATUS_EMOJI=":fast_forward:";     STATUS_COLOR="#808080"; STATUS_TEXT="Skipped (docs/tooling label)" ;;
            *)         STATUS_EMOJI=":question:";         STATUS_COLOR="#808080"; STATUS_TEXT="Unknown"   ;;
          esac

          ENV_URL_FIELD=""
          if [[ "$DEPLOY_RESULT" == "success" && -n "$MULTIDEV_URL" ]]; then
            ENV_URL_FIELD=",{\"title\": \"RC Multidev URL\", \"value\": \"<${MULTIDEV_URL}|${MULTIDEV_URL}>\", \"short\": false}"
          fi

          AUDIT_FIELD=""
          case "$AUDIT_RESULT" in
            success)
              if [[ "${AUDIT_ADVISORIES:-0}" -gt 0 ]]; then
                AUDIT_FIELD=",{\"title\": \"Composer audit\", \"value\": \":warning: ${AUDIT_ADVISORIES} advisor(y/ies), none blocking\", \"short\": true}"
              else
                AUDIT_FIELD=",{\"title\": \"Composer audit\", \"value\": \":white_check_mark: clean\", \"short\": true}"
              fi ;;
            failure)
              AUDIT_FIELD=",{\"title\": \"Composer audit\", \"value\": \":x: ${AUDIT_BLOCKING:-?} blocking advisor(y/ies) (drupal/*: ${AUDIT_DRUPAL:-?}) — RC gate failed\", \"short\": true}"
              STATUS_COLOR="danger"; STATUS_TEXT="${STATUS_TEXT} — advisory gate failed" ;;
          esac

          ERROR_FIELD=""
          if [[ "$DEPLOY_RESULT" == "failure" && -n "$FAILED_STEP" && -n "$ERROR_MESSAGE" ]]; then
            FAILED_STEP_ESCAPED=$(printf '%s' "$FAILED_STEP" | jq -Rs .)
            ERROR_MSG_ESCAPED=$(printf '%s' "$ERROR_MESSAGE" | jq -Rs .)
            ERROR_FIELD=",{\"title\": \"Failed Step\", \"value\": ${FAILED_STEP_ESCAPED}, \"short\": true},{\"title\": \"Error Details\", \"value\": ${ERROR_MSG_ESCAPED}, \"short\": false}"
          fi

          curl -X POST -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "{
              \"channel\": \"${SLACK_CHANNEL}\",
              \"text\": \"${STATUS_EMOJI} RC Multidev Deployment ${STATUS_TEXT}\",
              \"attachments\": [
                {
                  \"color\": \"${STATUS_COLOR}\",
                  \"fields\": [
                    {\"title\": \"Repository\", \"value\": \"${REPO}\", \"short\": true},
                    {\"title\": \"Environment\", \"value\": \"${TARGET_ENV}\", \"short\": true},
                    {\"title\": \"Site\", \"value\": \"${SITE}\", \"short\": true},
                    {\"title\": \"Status\", \"value\": \"${STATUS_TEXT}\", \"short\": true},
                    {\"title\": \"Workflow\", \"value\": \"<https://github.com/${REPO}/actions/runs/${RUN_ID}|View Workflow>\", \"short\": false}
                    ${ENV_URL_FIELD}
                    ${AUDIT_FIELD}
                    ${ERROR_FIELD}
                  ],
                  \"footer\": \"GitHub Actions\",
                  \"ts\": $(date +%s)
                }
              ]
            }" \
            https://slack.com/api/chat.postMessage
