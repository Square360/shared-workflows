name: Reusable PHP Quality (class-load + unit tests + PHPStan)

# -----------------------------------------------------------------------------
# Static quality gate for Drupal repos — no database, no Pantheon, no deploy.
#
# PHP version: taken from pantheon.yml `php_version` (what production runs),
# falling back to composer.json `config.platform.php`, then 8.3. When both
# files name a version and they disagree, the job fails: composer would be
# resolving dependencies for a different PHP than production runs. An explicit
# `php_version` input still overrides. (#159: a per-repo input in the caller's
# workflow file was lost on a template update and the job ran 8.3 on an 8.4
# site, dying on composer's platform check.)
#
# Three checks:
#
#   1. Plugin class-load check (runs when web/modules/custom exists).
#      Runs CDI's packaged script,
#      vendor/square360/copilot-drupal-instructions/skills/php-quality/
#      references/plugin-class-load-check.php — one copy shared by local runs
#      and CI (#158). It class-loads every class under web/modules/custom/**/
#      src/Plugin and src/Hook; a contrib update that adds parameter/return
#      types to a base-class method is a PHP compile fatal in every custom
#      subclass with the old signature, invisible on a green multidev unless
#      review exercised the plugin path. (Origin: som.yale.edu /admin/content
#      outage, 2026-08-18.) Failures in extensions not enabled in
#      config/sync/core.extension.yml are warnings unless
#      CLASS_LOAD_FAIL_NOT_ENABLED=1. Repos on CDI older than 4.38.0 (no
#      packaged script) get a warning and the check is skipped, not failed:
#      a tooling version must not turn CI red across the fleet.
#
#   2. Unit tests (conditional; skip-don't-fail).
#      Custom modules' PHPUnit *Unit* suites only (no Kernel/Functional: those
#      need a database). Skips with a notice when there are no
#      web/modules/custom/*/tests/src/Unit directories or no vendor/bin/phpunit.
#
#   3. PHPStan (conditional).
#      Runs `phpstan analyse` with the repo's phpstan.neon (CDI seeds one at
#      level 5; level 8 is a release-time report, not a gate). Skips with a
#      notice when there is no phpstan.neon(.dist) or no vendor/bin/phpstan.
#      When phpstan-baseline.neon is still the empty file CDI seeded (the repo
#      has not generated its real baseline yet), findings are reported as
#      annotations without failing the job.
#
# Composer note: with composer_no_dev the class-load script (CDI is a dev
# dependency), unit tests and PHPStan are all unavailable and skip with notices.
# -----------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      php_version:
        description: 'PHP version override. Empty (default) = pantheon.yml php_version, else composer.json config.platform.php, else 8.3'
        required: false
        type: string
        default: ''
      composer_no_dev:
        description: 'Install without dev dependencies (class-load, unit tests and PHPStan all skip)'
        required: false
        type: boolean
        default: false
      scan_paths:
        description: 'Space-separated roots to class-load (relative to repo root)'
        required: false
        type: string
        default: 'web/modules/custom'
      exclude_classes:
        description: 'Space-separated fully-qualified class names to skip (optional-dependency subclasses)'
        required: false
        type: string
        default: ''
      run_phpstan:
        description: 'Run PHPStan when the repo has a phpstan.neon. Default on.'
        required: false
        type: boolean
        default: true

jobs:
  php-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve PHP version
        id: php
        env:
          OVERRIDE: ${{ inputs.php_version }}
        run: |
          mm() { printf '%s' "$1" | grep -oE '^[0-9]+\.[0-9]+'; }
          pantheon=""
          if [ -f pantheon.yml ]; then
            pantheon=$(mm "$(sed -nE "s/^php_version:[[:space:]]*[\"']?([0-9][0-9.]*).*/\1/p" pantheon.yml | head -n1)")
          fi
          platform=""
          if [ -f composer.json ]; then
            platform=$(mm "$(jq -r '.config.platform.php // empty' composer.json)")
          fi
          if [ -n "$pantheon" ] && [ -n "$platform" ] && [ "$pantheon" != "$platform" ]; then
            echo "::error::pantheon.yml php_version is $pantheon but composer.json config.platform.php is $platform. Composer resolves dependencies for $platform while production runs $pantheon; make them match."
            exit 1
          fi
          if [ -n "$OVERRIDE" ]; then
            version="$OVERRIDE"; source="php_version input"
          elif [ -n "$pantheon" ]; then
            version="$pantheon"; source="pantheon.yml"
          elif [ -n "$platform" ]; then
            version="$platform"; source="composer.json config.platform.php"
          else
            version="8.3"; source="default (no pantheon.yml php_version or config.platform.php)"
            echo "::notice::PHP version defaulted to 8.3: set php_version in pantheon.yml"
          fi
          echo "PHP $version (from $source)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.version }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Composer install
        run: |
          if [ "${{ inputs.composer_no_dev }}" = "true" ]; then
            composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          else
            composer install --optimize-autoloader --no-interaction --no-progress
          fi

      - name: Plugin class-load check
        env:
          SCAN_PATHS: ${{ inputs.scan_paths }}
          EXCLUDE_CLASSES: ${{ inputs.exclude_classes }}
        run: |
          if [ ! -d web/modules/custom ]; then
            echo "::notice::plugin class-load check skipped: no web/modules/custom directory"
            exit 0
          fi
          SCRIPT=vendor/square360/copilot-drupal-instructions/skills/php-quality/references/plugin-class-load-check.php
          if [ ! -f "$SCRIPT" ]; then
            echo "::warning::plugin class-load check skipped: $SCRIPT not found. Update square360/copilot-drupal-instructions to >= 4.38.0 (it ships the script; CI no longer carries its own copy). With composer_no_dev the script is not installed."
            exit 0
          fi
          php "$SCRIPT" "$SCAN_PATHS" "$EXCLUDE_CLASSES"

      - name: Unit tests (custom modules)
        if: ${{ !inputs.composer_no_dev }}
        run: |
          UNIT_DIRS=$(find web/modules/custom -type d -path '*/tests/src/Unit' 2>/dev/null || true)
          if [ -z "$UNIT_DIRS" ]; then
            echo "::notice::unit tests skipped: no web/modules/custom/*/tests/src/Unit directories"
            exit 0
          fi
          if [ ! -x vendor/bin/phpunit ]; then
            echo "::notice::unit tests skipped: vendor/bin/phpunit not installed (add drupal/core-dev to require-dev)"
            exit 0
          fi
          # Custom Unit suites only — no Kernel/Functional (they need a DB).
          # PHPUnit >=9 accepts a single path argument — run once per module.
          FAIL=0
          while IFS= read -r dir; do
            echo "── $dir"
            vendor/bin/phpunit -c web/core "$dir" || FAIL=1
          done <<< "$UNIT_DIRS"
          exit $FAIL

      - name: Unit tests skipped (no-dev install)
        if: ${{ inputs.composer_no_dev }}
        run: |
          echo "::notice::unit tests skipped: composer_no_dev is true (dev dependencies not installed)"

      - name: PHPStan
        if: ${{ !inputs.composer_no_dev && inputs.run_phpstan }}
        run: |
          CONFIG=""
          for f in phpstan.neon phpstan.neon.dist; do
            if [ -f "$f" ]; then CONFIG="$f"; break; fi
          done
          if [ -z "$CONFIG" ]; then
            echo "::notice::PHPStan skipped: no phpstan.neon (recent CDI versions seed one; see the php-quality skill)"
            exit 0
          fi
          if [ ! -x vendor/bin/phpstan ]; then
            echo "::notice::PHPStan skipped: vendor/bin/phpstan not installed (add drupal/core-dev to require-dev)"
            exit 0
          fi
          # A baseline still carrying CDI's seed header has never been
          # generated: report the findings, don't fail on the debt that a
          # real baseline would record.
          if [ -f phpstan-baseline.neon ] && grep -q 'seeded empty by square360/copilot-drupal-instructions' phpstan-baseline.neon; then
            echo "::warning::PHPStan baseline not generated yet: findings are reported, not failing. Generate and commit it: vendor/bin/phpstan analyse --generate-baseline (php-quality skill)."
            vendor/bin/phpstan analyse -c "$CONFIG" --no-progress --memory-limit=1G --error-format=github || true
            exit 0
          fi
          vendor/bin/phpstan analyse -c "$CONFIG" --no-progress --memory-limit=1G --error-format=github
