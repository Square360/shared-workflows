name: Reusable Route Smoke (authenticated key-route checks)

# -----------------------------------------------------------------------------
# Modeled on reusable-pantheon-security-scan.yml (same secrets pattern, same
# LIVE refusal). Curls a per-repo list of key routes on a deployed multidev
# through an authenticated session obtained via `drush uli`, and asserts each
# route's HTTP status.
#
# Why: admin-only fatals are invisible to anonymous checks and to green CI —
# the som.yale.edu 2026-08-18 outage (VBO 4.4.7 typed-signature fatal) 500'd
# /admin/content for editors while the front end and every anonymous probe
# stayed healthy. This workflow tests the real environment — real database,
# real enabled modules — which no runner-built site can reproduce.
#
# Route list: `.github/smoke-routes.txt` in the consuming repo (override via
# the routes_file input). One route per line, optional expected status
# (defaults to 200). Blank lines and #-comments ignored.
#
# Recommended starting list — each line names what it exercises:
#
#     /admin/content              # content view + VBO action plugins
#     /admin/content/media        # media VBO + media library
#     /admin/people               # user VBO (third action-plugin surface)
#     /admin/config               # renders every config-section menu link
#     /admin/structure/views      # views UI listing / plugin discovery
#     /admin/structure/menu       # menu list — entity-type alter handlers (2026-08-18 SOM incident)
#     /admin/structure/types      # bundle list + entity handlers
#     /admin/reports/status       # runs every module's requirements hooks
#     /admin/reports/dblog        # watchdog UI
#     /node/add                   # add-content bundle list
#     /node/add/page              # full node form — field-widget fatals (per-repo bundle)
#     / 200                       # anonymous front-page baseline
#
# Redirects are NOT followed on assertions — a 302-to-login where 200 is
# expected means the session died, and that's a failure worth seeing.
# Missing routes file → visible "skipped" notice, not a failure (same
# rollout philosophy as reusable-php-quality: repos opt in by adding the file).
#
# Auth: `drush uli` mints a one-time login link. Account resolution:
# uli_options input > ROUTE_SMOKE_ULI_OPTIONS repo variable > org variable >
# uid 1. Hardened sites (uid 1 blocked by design) set the variable once —
# e.g. "--name=s360sysadmin" at the org level covers the whole fleet, and
# nested callers (pr-multidev's built-in smoke) inherit it with no caller
# edits. The link is single-use, masked in logs, and the session cookie
# lives only in the ephemeral runner. A per-repo variable or uli_options
# input can name an editor account for role-accurate checks.
#
# LIVE is refused, same as the ZAP scan: this workflow logs in with uli —
# it has no business doing that on production. Call it after the deploy has
# settled (see the settle gates in the deploy workflows, v4.4.x).
# -----------------------------------------------------------------------------

on:
  workflow_call:
    inputs:
      pantheon_site:
        description: 'Pantheon site machine name'
        required: true
        type: string
      target_env:
        description: 'Target environment name (e.g. rc-2026-34 or pr-42) — never live'
        required: true
        type: string
      routes_file:
        description: 'Path (in the consuming repo) to the route list'
        required: false
        type: string
        default: '.github/smoke-routes.txt'
      uli_options:
        description: 'Extra options for drush uli (e.g. --name=smoke_editor for role-accurate checks). Empty = fall back to the ROUTE_SMOKE_ULI_OPTIONS repo/org variable, then uid 1.'
        required: false
        type: string
        default: ''
      slack_channel:
        description: 'Slack channel for FAILURE notifications only (quiet on green — the deploy notice already announces the env). Empty = no Slack.'
        required: false
        type: string
        default: ''
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true

jobs:
  route-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Check route list exists
        id: routes_check
        run: |
          if [ ! -f "${{ inputs.routes_file }}" ]; then
            echo "::notice::route smoke skipped: no ${{ inputs.routes_file }} in this repo (add one to opt in)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure 1Password
        if: steps.routes_check.outputs.enabled == 'true'
        uses: 1password/load-secrets-action/configure@v5
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Load secrets
        if: steps.routes_check.outputs.enabled == 'true'
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          PANTHEON_MACHINE_TOKEN: op://s360-cicd/pantheon/machine-token
          PANTHEON_SSH_KEY: op://s360-cicd/pantheon/ssh-key
          SLACK_BOT_TOKEN: op://s360-cicd/slack/bot-token

      # terminus drush executes over SSH to the appserver — the machine token
      # alone is not enough (first guinea-pig run: "Permission denied
      # (publickey)" after a 5-minute terminus retry crawl).
      - name: Load SSH key
        if: steps.routes_check.outputs.enabled == 'true'
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ env.PANTHEON_SSH_KEY }}

      - name: Install Terminus
        if: steps.routes_check.outputs.enabled == 'true'
        env:
          TERMINUS_MACHINE_TOKEN: ${{ env.PANTHEON_MACHINE_TOKEN }}
        run: |
          TERMINUS_VERSION=$(curl -s --retry 5 --retry-all-errors --retry-delay 3 -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/pantheon-systems/terminus/releases/latest | grep '"tag_name"' | cut -d'"' -f4)
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 "https://github.com/pantheon-systems/terminus/releases/download/${TERMINUS_VERSION}/terminus.phar" \
            -o /usr/local/bin/terminus
          chmod +x /usr/local/bin/terminus
          terminus auth:login --machine-token="$TERMINUS_MACHINE_TOKEN"

      - name: Run route smoke
        id: smoke
        if: steps.routes_check.outputs.enabled == 'true'
        env:
          SITE: ${{ inputs.pantheon_site }}
          TARGET_ENV: ${{ inputs.target_env }}
          ROUTES_FILE: ${{ inputs.routes_file }}
          # uli account resolution: explicit input > caller repo variable >
          # org variable > empty (uid 1). `vars` resolves against the CALLING
          # repo (then its org), so hardened sites set
          # ROUTE_SMOKE_ULI_OPTIONS (e.g. "--name=s360sysadmin") once as a
          # repo or org variable and every caller — including the nested
          # call inside pr-multidev, which passes no uli_options — inherits
          # it with zero caller-file edits.
          ULI_OPTIONS: ${{ inputs.uli_options != '' && inputs.uli_options || vars.ROUTE_SMOKE_ULI_OPTIONS }}
        run: |
          if [[ "$TARGET_ENV" == "live" ]]; then
            echo "::error::Refusing to run route smoke against LIVE. This workflow logs in via uli — multidev/test only."
            exit 1
          fi

          # env:view may return a basic-auth-locked URL (https://user:pass@host).
          # Split credentials out: curl gets them via -u, uli gets the clean
          # base URL, and only the clean form is ever printed.
          RAW_URL=$(terminus env:view "$SITE.$TARGET_ENV" --print 2>/dev/null \
            | grep -oE 'https?://[^[:space:]]+' | head -1 | tr -d '[:space:]')
          if [[ -z "$RAW_URL" ]]; then
            echo "::error::Could not resolve URL for $SITE.$TARGET_ENV — does the environment exist?"
            exit 1
          fi
          RAW_URL="${RAW_URL%/}"
          TARGET_URL=$(echo "$RAW_URL" | sed -E 's#https?://[^@/]*@#https://#')
          CURL_AUTH=()
          if [[ "$RAW_URL" != "$TARGET_URL" ]]; then
            CREDS=$(echo "$RAW_URL" | grep -oE '//[^@/]*@' | tr -d '/@')
            echo "::add-mask::$CREDS"
            CURL_AUTH=(-u "$CREDS")
            echo "Environment is basic-auth locked."
          fi
          echo "Target: $TARGET_URL"

          # Wake the environment (idle multidevs 502 the first request).
          terminus env:wake "$SITE.$TARGET_ENV" >/dev/null 2>&1 || true

          # Self-unban. Sites running s360_security_core/advban carry a ban
          # table in every cloned multidev DB, and hundreds of those rows are
          # /24 ranges inside Microsoft space — which is where GitHub-hosted
          # runners live. A runner that draws a banned address gets a 403 on
          # EVERY route, including the anonymous baseline, before Drupal even
          # routes (NJ211 rc-2026-38, 2026-09-16: 254 active range bans inside
          # api.github.com/meta "actions"). Drop any ban covering this runner
          # first; harmless on sites without the module (command unknown).
          EGRESS_IP=$(curl -s --max-time 10 https://api.ipify.org || curl -s --max-time 10 https://ifconfig.me || true)
          if [[ -n "$EGRESS_IP" ]]; then
            echo "Runner egress IP: $EGRESS_IP"
            UNBAN_OUT=$(terminus drush "$SITE.$TARGET_ENV" -- s360:security:unban "$EGRESS_IP" 2>&1 || true)
            if echo "$UNBAN_OUT" | grep -qi "unbanned"; then
              echo "::warning::Runner IP $EGRESS_IP was banned on $SITE.$TARGET_ENV and has been unbanned for this run. Scanners share Microsoft ranges with GitHub runners — this is expected, not a site fault."
            elif echo "$UNBAN_OUT" | grep -qiE "not defined|command .* not found|Unknown command"; then
              echo "s360_security_core not on this site; skipping self-unban."
            fi
          fi

          # One-time login link → session cookie. The link is a credential:
          # mask it before anything can echo it. NOTE: uid 1 is blocked on
          # hardened sites — pass uli_options: '--name=<account>' there; the
          # landing check below catches a login that didn't stick.
          ULI_ERR=$(mktemp)
          echo "[$SECONDS s] requesting uli link (cold multidevs can take minutes on first drush bootstrap)..."
          LOGIN_URL=$(terminus drush "$SITE.$TARGET_ENV" -- uli --uri="$TARGET_URL" $ULI_OPTIONS 2>"$ULI_ERR" | grep -oE 'https?://[^[:space:]]+' | tail -1)
          echo "[$SECONDS s] uli returned"
          if [[ -z "$LOGIN_URL" ]]; then
            if grep -qi "blocked" "$ULI_ERR"; then
              echo "::error::drush uli account is BLOCKED (hardened site — uid 1 is blocked by design). Fix: set repo or org variable ROUTE_SMOKE_ULI_OPTIONS to an unblocked admin account, e.g. --name=s360sysadmin. No caller-file edit needed."
            else
              echo "::error::drush uli returned no login link (bad --name in uli_options? set ROUTE_SMOKE_ULI_OPTIONS repo/org variable for hardened sites). terminus/drush stderr follows:"
            fi
            sed 's/^/  /' "$ULI_ERR"
            exit 1
          fi
          echo "::add-mask::$LOGIN_URL"
          JAR=$(mktemp)
          # TLS on a freshly-provisioned multidev edge can flap — retry, and
          # report the curl error instead of dying bare (exit 35 = SSL
          # handshake, seen on the first TEDCO guinea-pig run).
          if ! CURL_ERR=$(curl -sSL --max-time 30 --retry 4 --retry-delay 10 --retry-all-errors "${CURL_AUTH[@]}" -c "$JAR" -b "$JAR" -o /dev/null "$LOGIN_URL" 2>&1); then
            RC=$?
            echo "::error::login request failed after retries (curl exit $RC): $CURL_ERR"
            exit 1
          fi
          echo "[$SECONDS s] session established"

          # Session sanity: authenticated /user lands on /user/<uid>;
          # anonymous bounces to /user/login. A dead session must fail here,
          # not produce confusing per-route 403s.
          LANDED=$(curl -s -o /dev/null -w '%{url_effective}' -L --max-time 30 "${CURL_AUTH[@]}" -c "$JAR" -b "$JAR" "$TARGET_URL/user")
          if [[ "$LANDED" == *"/user/login"* ]]; then
            echo "::error::uli login did not stick — /user bounced to the login page"
            exit 1
          fi
          # A banned runner gets a bare 403 "<ip> has been banned" from the
          # advban middleware on every URL — name that instead of letting it
          # surface as eleven per-route 403s.
          BODY=$(curl -s --max-time 30 "${CURL_AUTH[@]}" -c "$JAR" -b "$JAR" "$TARGET_URL/user")
          if echo "$BODY" | grep -qi "has been banned"; then
            echo "::error::Runner IP is BANNED on $SITE.$TARGET_ENV (advban): \"$(echo "$BODY" | head -c 120)\". Self-unban did not clear it — check that s360_security_core is enabled and the drush command runs there."
            exit 1
          fi

          FAIL=0
          CHECKED=0
          while IFS= read -r line; do
            line="${line%%#*}"
            line=$(echo "$line" | xargs || true)
            [[ -z "$line" ]] && continue
            ROUTE=$(echo "$line" | awk '{print $1}')
            EXPECTED=$(echo "$line" | awk '{print $2}')
            EXPECTED="${EXPECTED:-200}"
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "${CURL_AUTH[@]}" -c "$JAR" -b "$JAR" "$TARGET_URL$ROUTE")
            CHECKED=$((CHECKED+1))
            if [[ "$CODE" == "$EXPECTED" ]]; then
              echo "✓ $ROUTE → $CODE"
            else
              echo "::error::route smoke FAILED: $ROUTE expected $EXPECTED, got $CODE"
              FAILED_LIST="${FAILED_LIST}${ROUTE} (expected ${EXPECTED}, got ${CODE})\n"
              FAIL=1
            fi
          done < "$ROUTES_FILE"

          rm -f "$JAR"
          echo "failed_routes=${FAILED_LIST}" >> "$GITHUB_OUTPUT"
          echo "checked=${CHECKED}" >> "$GITHUB_OUTPUT"
          if [[ "$FAIL" == "1" ]]; then
            echo "::error::route smoke: failures on $TARGET_URL ($CHECKED routes checked)"
            exit 1
          fi
          echo "route smoke: $CHECKED routes clean on $TARGET_URL"

      # Failure-only by design: green smoke adds nothing actionable and the
      # deploy's own Slack notice already announces the environment.
      - name: Notify Slack on failure
        if: >
          failure() &&
          steps.routes_check.outputs.enabled == 'true' &&
          inputs.slack_channel != ''
        env:
          SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ inputs.slack_channel }}
          SITE: ${{ inputs.pantheon_site }}
          TARGET_ENV: ${{ inputs.target_env }}
          FAILED_ROUTES: ${{ steps.smoke.outputs.failed_routes }}
          CHECKED: ${{ steps.smoke.outputs.checked }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -n "$FAILED_ROUTES" ]]; then
            DETAIL=$(printf '%b' "$FAILED_ROUTES")
          else
            DETAIL="smoke run failed before route checks (uli/session/url stage) — see the run log"
          fi
          export SLACK_TEXT=$(printf ':rotating_light: *Route smoke FAILED* on `%s.%s` (%s routes checked)\n%s\n<%s|Run log>' "$SITE" "$TARGET_ENV" "${CHECKED:-0}" "$DETAIL" "$RUN_URL")
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"channel": os.environ["SLACK_CHANNEL"], "text": os.environ["SLACK_TEXT"]}))')
          curl -s --max-time 30 -X POST \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD" \
            https://slack.com/api/chat.postMessage >/dev/null || true

